<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安全凭据</title>
    <style>
      body {
        font: 14px system-ui;
        margin: 0;
        padding: 24px;
        color: #172033;
        background: #f8fafc;
      }
      label,
      textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }
      textarea {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #ccd4e0;
        border-radius: 8px;
        min-height: 190px;
        resize: vertical;
        font:
          13px ui-monospace,
          monospace;
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }
      button {
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button[type='submit'] {
        background: #3155d9;
        color: white;
      }
    </style>
  </head>
  <body>
    <form id="credential-form">
      <label
        ><span id="credential-label">凭据值</span
        ><textarea
          id="credential-value"
          autocomplete="off"
          spellcheck="false"
          autofocus
          required
        ></textarea>
      </label>
      <footer>
        <button id="cancel" type="button">取消</button><button type="submit">安全保存</button>
      </footer>
    </form>
    <script type="module" src="/credential.ts"></script>
  </body>
</html>
