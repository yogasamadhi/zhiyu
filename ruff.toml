# Ruff configuration for the repository level Python launchers.
# The analytics worker keeps its own configuration in
# desktop/analytics-worker/pyproject.toml.
line-length = 100
target-version = "py39"

exclude = [
  ".artifacts",
  ".data",
  "desktop/analytics-worker",
  "dsh-plugin/.test",
  "dsh-plugin/lib",
  "dsh-plugin/out",
  "dsh-plugin/resources",
  "node_modules",
  "vendor",
]

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
