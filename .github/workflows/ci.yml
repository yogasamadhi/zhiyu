name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install uv==0.11.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm run worker:sync
      - run: pnpm run lint
      - run: pnpm run python:lint
      - run: pnpm run format:check
      - run: pnpm run python:format:check
      - run: pnpm run client:check
      - run: pnpm run worker:client:check
      - run: pnpm run architecture:check
      - run: pnpm run architecture:deps
      - run: pnpm run dependency:audit
      - run: pnpm run compliance:licenses
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run test:platform
      - run: pnpm run test:worker-client
      - run: pnpm run test:integration
      - run: pnpm run test:conformance
      - run: pnpm run test:security
      - run: pnpm run worker:test
      - run: pnpm run build
      - run: pnpm run browser:install

  desktop-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install uv==0.11.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm run worker:sync
      - run: pnpm run worker:build
      - run: pnpm run worker:smoke
      - run: pnpm run desktop:browser
      - run: pnpm run desktop:test
      - run: pnpm run desktop:package -- --arch=${{ matrix.arch }}
      - run: pnpm --filter @zhiyun/desktop test:packaged
      - run: pnpm run desktop:make -- --arch=${{ matrix.arch }}
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyun-${{ runner.os }}-${{ matrix.arch }}
          path: desktop/out/make/**
