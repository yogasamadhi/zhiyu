name: Signed Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install uv==0.11.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm run worker:sync
      - run: pnpm run browser:install
      - run: pnpm run release:verify

  signed-installers:
    needs: release-verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install uv==0.11.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dependency:audit
      - run: pnpm run worker:sync
      - run: pnpm run worker:build
      - run: pnpm run worker:smoke
      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$MAC_CODESIGN_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Prepare Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$WINDOWS_CERTIFICATE_BASE64"
          test -n "$WINDOWS_CERTIFICATE_PASSWORD"
          printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/zhiyun-signing.pfx"
          echo "WINDOWS_CERTIFICATE_FILE=$RUNNER_TEMP/zhiyun-signing.pfx" >> "$GITHUB_ENV"
      - run: pnpm run desktop:browser
      - run: pnpm run desktop:test
      - run: pnpm run desktop:package -- --arch=${{ matrix.arch }}
      - run: pnpm --filter @zhiyun/desktop test:packaged
      - run: pnpm run desktop:make -- --arch=${{ matrix.arch }}
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: anchore/sbom-action@v0
        with:
          path: desktop/out
          output-file: desktop/out/zhiyun-desktop-${{ runner.os }}-${{ matrix.arch }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyun-signed-${{ runner.os }}-${{ matrix.arch }}
          path: |
            desktop/out/make/**
            desktop/out/zhiyun-desktop-${{ runner.os }}-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
