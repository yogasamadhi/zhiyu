name: Signed Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zhiyun
          POSTGRES_PASSWORD: zhiyun
          POSTGRES_DB: zhiyun
        ports: ['45432:5432']
        options: >-
          --health-cmd "pg_isready -U zhiyun"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ['46379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install uv==0.11.14
      - run: bun install --frozen-lockfile
      - run: bun run worker:sync
      - run: bun run browser:install
      - run: bun run release:verify

  headless-linux:
    needs: release-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install uv==0.11.14
      - run: bun install --frozen-lockfile
      - run: bun run dependency:audit
      - run: bun run worker:sync
      - run: bun run worker:build
      - run: bun run worker:smoke
      - run: bun run --filter @zhiyun/api package:linux
      - run: bun run --filter @zhiyun/api test:packaged
      - run: docker build -f apps/api/Dockerfile -t zhiyun-headless:1.0.0 .
      - run: bun run test:e2e:headless-compose
        env:
          ZHIYUN_IMAGE: zhiyun-headless:1.0.0
      - uses: anchore/sbom-action@v0
        with:
          path: apps/api/dist/headless/linux-x64
          output-file: apps/api/dist/headless/zhiyun-headless-1.0.0-linux-x64.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyun-headless-linux-x64
          path: |
            apps/api/dist/headless/zhiyun-headless-1.0.0-linux-x64.tar.gz
            apps/api/dist/headless/zhiyun-headless-1.0.0-linux-x64.spdx.json
          if-no-files-found: error

  signed-installers:
    needs: release-verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install uv==0.11.14
      - run: bun install --frozen-lockfile
      - run: bun run dependency:audit
      - run: bun run worker:sync
      - run: bun run worker:build
      - run: bun run worker:smoke
      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$MAC_CODESIGN_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Prepare Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$WINDOWS_CERTIFICATE_BASE64"
          test -n "$WINDOWS_CERTIFICATE_PASSWORD"
          printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/zhiyun-signing.pfx"
          echo "WINDOWS_CERTIFICATE_FILE=$RUNNER_TEMP/zhiyun-signing.pfx" >> "$GITHUB_ENV"
      - run: bun run desktop:browser
      - run: bun run desktop:test
      - run: bun run desktop:package -- --arch=${{ matrix.arch }}
      - run: bun run --filter @zhiyun/desktop test:packaged
      - run: bun run desktop:make -- --arch=${{ matrix.arch }}
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: anchore/sbom-action@v0
        with:
          path: apps/desktop/out
          output-file: apps/desktop/out/zhiyun-desktop-${{ runner.os }}-${{ matrix.arch }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyun-signed-${{ runner.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/out/make/**
            apps/desktop/out/zhiyun-desktop-${{ runner.os }}-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
