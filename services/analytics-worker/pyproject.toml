[project]
name = "zhiyun-analytics-worker"
version = "1.0.0"
description = "Local supervised analytics worker for ZhiYun"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasketch>=1.6.5,<2",
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "jieba>=0.42.1,<1",
  "numpy>=2.2,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<4",
  "polars>=1.30,<2",
  "pyarrow>=20,<30",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "statsmodels>=0.14,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
zhiyun-analytics-worker = "zhiyun_analytics_worker.main:run"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.130,<7",
  "pyinstaller>=6.13,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhiyun_analytics_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
