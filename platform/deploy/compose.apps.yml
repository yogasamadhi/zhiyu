# Combine with compose.yml. Test deployment only; never use production database/model resources.
services:
  migrate:
    build: { context: ../.., dockerfile: platform/deploy/Dockerfile, target: server }
    image: zhiyun-cloud-server:local
    command: [bun, dist/migrate.js]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
  server:
    image: zhiyun-cloud-server:local
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "const r=await fetch('http://localhost:3200/api/cloud/v1/health');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    image: zhiyun-cloud-server:local
    command: [bun, dist/worker.js]
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
  portal:
    build: { context: ../.., dockerfile: platform/deploy/Dockerfile, target: portal }
    image: zhiyun-cloud-portal:local
    environment:
      CLOUD_SERVER_URL: http://server:3200
    restart: unless-stopped
  admin:
    build: { context: ../.., dockerfile: platform/deploy/Dockerfile, target: admin }
    image: zhiyun-cloud-admin:local
    restart: unless-stopped
  proxy:
    image: caddy:2.10-alpine
    env_file: .env
    ports: ['127.0.0.1:8443:443', '127.0.0.1:8080:80']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'cloud-caddy:/data']
    depends_on: [portal, admin, server]
volumes:
  cloud-caddy:
