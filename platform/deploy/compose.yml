name: cloud

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zhiyun
      POSTGRES_PASSWORD: ${CLOUD_POSTGRES_PASSWORD:-zhiyun-local}
      POSTGRES_DB: zhiyun_cloud
    ports: ['127.0.0.1:55432:5432']
    volumes: [cloud-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U zhiyun -d zhiyun_cloud']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:56379:6379']
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
volumes:
  cloud-postgres:
