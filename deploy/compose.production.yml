name: zhiyun

services:
  zhiyun:
    image: ${ZHIYUN_IMAGE:-zhiyun/zhiyun:1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://zhiyun:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/zhiyun
      REDIS_URL: redis://redis:6379
      ZHIYUN_DATA_DIR: /var/lib/zhiyun
      ZHIYUN_OUTPUT_ROOT: /var/lib/zhiyun/outputs
      ZHIYUN_PUBLIC_URL: ${ZHIYUN_PUBLIC_URL:?set an https public URL}
      ZHIYUN_ALLOWED_ORIGINS: ${ZHIYUN_PUBLIC_URL}
      ZHIYUN_TRUST_PROXY: 'true'
      # May be removed after the first administrator is created. If the database is empty,
      # initialization remains disabled until a fresh token is configured explicitly.
      ZHIYUN_BOOTSTRAP_TOKEN: ${ZHIYUN_BOOTSTRAP_TOKEN:-}
      ZHIYUN_CREDENTIAL_KEY: ${ZHIYUN_CREDENTIAL_KEY:?set a random encryption key}
    volumes:
      - ./data:/var/lib/zhiyun
    healthcheck:
      test: ['CMD', 'bash', '-ec', 'curl -fsS http://127.0.0.1:3001/ready >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - '3001'
    stop_grace_period: 60s

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhiyun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: zhiyun
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhiyun -d zhiyun']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      zhiyun:
        condition: service_healthy
    environment:
      ZHIYUN_DOMAIN: ${ZHIYUN_DOMAIN:?set the public hostname}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
